<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PocketSmart AI{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>
  <nav>
    <a class="brand" href="/">💰 PocketSmart AI</a>
    <div>
      {% if user %}
        <a href="/dashboard">Dashboard</a>
        <a href="/planner/home">Home</a>
        <a href="/planner/party">Party</a>
        <a href="/planner/jewelry">Jewelry</a>
        <a href="/history">History</a>
        <a href="/logout">Logout ({{ user.username }})</a>
      {% else %}
        <a href="/login">Login</a>
        <a href="/register">Register</a>
      {% endif %}
    </div>
  </nav>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
